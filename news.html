<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CBS5M - News</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        .blog-post {
            background: rgba(0, 30, 20, 0.5);
            border-radius: 16px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            border: 1px solid #2a5a2a40;
            transition: border-color 0.3s;
        }
        .blog-post:hover {
            border-color: #3eeb0e60;
        }
        .blog-post h3 {
            margin-top: 0;
        }
        .blog-post h3 a {
            color: #6dede7;
            text-decoration: none;
            background: none;
            padding: 0;
            display: inline;
        }
        .blog-post h3 a:hover {
            color: #b9ffcf;
            text-decoration: underline;
        }
        .post-date {
            font-size: 0.85rem;
            opacity: 0.6;
            margin-bottom: 0.8rem;
        }
        .blog-post p {
            font-size: 0.95rem;
        }
        .read-more {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 12px;
            color: black;
            text-decoration: none;
            background: linear-gradient(90deg, #3eeb0e, #6dede7, yellow, yellow);
            background-size: 300% 100%;
            background-position: 0% 0%;
            transition: background-position 0.4s ease;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        .read-more:hover {
            background-position: 100% 0%;
        }
        #blog-posts {
            margin: 1rem 0;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            opacity: 0.6;
        }
        .error-msg {
            text-align: center;
            padding: 2rem;
            color: #ff6666;
        }
        @media (max-width: 767px) {
            .blog-post {
                padding: 1rem;
            }
            .blog-post h3 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<img src="img1.png" alt="CBS5M" class="hero-img">
<header class="navbar">
    <div class="logo"></div>
    <nav>
        <ul>
            <li><a class="Hb" href="index.html">Home</a></li>
            <li><a href="Team.html">Team</a></li>

            <li style="margin-left:auto;"><a href="news.ru.html" class="lang-link">Русский</a></li>
        </ul>
    </nav>
</header>
    <div class="container">
        <h1>Latest News</h1>
        <p>Our latest updates and announcements from the official blog.</p>
        <div id="blog-posts">
            <div class="loading">Loading news...</div>
        </div>
    </div>
    <footer class="site-footer">
    <p>2020 - 2026. &copy; CBS5M Project.</p>
    <div class="footer-links">
        <a href="http://www.facebook.com/coinBusiness.official">Facebook</a>
        <a href="http://www.instagram.com/coinbusiness_official">Instagram</a>
        <a href="http://www.linkedin.com/company/coinbusiness">LinkedIn</a>
    </div>
</footer>
<script>
function renderPosts(json) {
    var feed = json.feed;
    var container = document.getElementById('blog-posts');
    if (!feed.entry || feed.entry.length === 0) {
        container.innerHTML = '<p style="text-align:center;opacity:0.6;">No posts yet.</p>';
        return;
    }
    var html = '';
    for (var i = 0; i < feed.entry.length; i++) {
        var entry = feed.entry[i];
        var title = entry.title.$t || 'Untitled';
        var date = entry.published.$t;
        var content = entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : '');
        var link = '';
        for (var j = 0; j < entry.link.length; j++) {
            if (entry.link[j].rel === 'alternate') {
                link = entry.link[j].href;
                break;
            }
        }
        var d = new Date(date);
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var formattedDate = months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        var plainText = content.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
        var snippet = plainText.substring(0, 350);
        if (plainText.length > 350) snippet += '...';
        html += '<div class="blog-post">';
        html += '<h3><a href="' + link + '" target="_blank" rel="noopener noreferrer">' + title + '</a></h3>';
        html += '<p class="post-date">' + formattedDate + '</p>';
        html += '<p>' + snippet + '</p>';
        html += '<a href="' + link + '" target="_blank" rel="noopener noreferrer" class="read-more">Read more</a>';
        html += '</div>';
    }
    container.innerHTML = html;
}
</script>
<script src="https://cbs5m.blogspot.com/feeds/posts/default?alt=json-in-script&callback=renderPosts&max-results=10"></script>
</body>
</html>
